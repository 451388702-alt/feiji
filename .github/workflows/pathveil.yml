name: Build PathVeil LSPosed APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unpack reviewed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, os
          archive = Path('PathVeil-0.1.0-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '47e0243cf3cf5c352c0b2ac84e035a30140869edc65b9e32a1231b2f08c7c71a'
          destination = Path('source').resolve()
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  if not (destination / name).resolve().is_relative_to(destination):
                      raise ValueError('Unsafe source archive entry')
              z.extractall(destination)
          sdk = Path(os.environ['ANDROID_HOME'])
          installed = sorted((sdk / 'ndk').glob('*/source.properties'), key=lambda p: tuple(int(x) for x in p.parent.name.split('.')))
          if not installed:
              raise RuntimeError('No preinstalled Android NDK found')
          ndk = installed[-1].parent.name
          config = destination / 'PathVeil/app/build.gradle.kts'
          config.write_text(config.read_text().replace('ndkVersion = "30.0.15729638"', f'ndkVersion = "{ndk}"'))
          print('Using preinstalled NDK:', ndk)
          PY
      - name: Build signed debug APK
        working-directory: source/PathVeil
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and LSPosed entry
        run: |
          mkdir -p deliverables
          cp source/PathVeil/app/build/outputs/apk/debug/app-debug.apk deliverables/PathVeil-0.1.0-lsposed-debug.apk
          APK=deliverables/PathVeil-0.1.0-lsposed-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK" > deliverables/signature-verification.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path('deliverables/PathVeil-0.1.0-lsposed-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.read('META-INF/xposed/java_init.list').decode().strip() == 'io.github.pathveil.xposed.Entry'
              assert z.read('META-INF/xposed/native_init.list').decode().strip() == 'libfusehide.so'
              assert 'classes.dex' in z.namelist()
              assert 'lib/arm64-v8a/libfusehide.so' in z.namelist()
              assert 'com.android.providers.media.module' in z.read('META-INF/xposed/scope.list').decode()
          PY
          (cd deliverables && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PathVeil-LSPosed-APK
          path: deliverables/
          if-no-files-found: error
          retention-days: 7
